<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Ranking de Dulces</title>
</head>
<body>
<div sec:authorize="hasRole('USUARIO')" th:replace="~{fragments/navbar-user :: navbar-user}"></div>
<h1>Ranking Top 10</h1>
<table>
    <thead>
    <tr>
        <th>Posición</th>
        <th>Usuario</th>
        <th>Intentos</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="ranking, i : ${ranking}">
        <td th:text="${i.index + 1}"></td>
        <td th:text="${ranking.usuario.nombre}"></td>
        <td th:text="${ranking.intentos}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
