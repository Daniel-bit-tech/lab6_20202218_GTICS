<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Ranking Top 10</title>
</head>
<body>
<div sec:authorize="hasRole('ADMIN')" th:replace="~{fragments/navbar-admin :: navbar-admin}"></div>
<div sec:authorize="hasRole('USUARIO')" th:replace="~{fragments/navbar-user :: navbar-user}"></div>

<h1>Ranking Top 10</h1>
<table>
  <thead>
  <tr>
    <th>Posición</th>
    <th>Usuario</th>
    <th>Intentos</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="rank, i : ${ranking}">
    <td th:text="${i.index + 1}"></td>
    <td th:text="${rank.usuario.nombre}"></td>
    <td th:text="${rank.intentos}"></td>
  </tr>
  </tbody>
</table>
</body>
</html>
