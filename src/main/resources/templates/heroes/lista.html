<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Héroes Navales</title>
</head>
<body>
<div sec:authorize="hasRole('ADMIN')" th:replace="~{fragments/navbar-admin :: navbar-admin}"></div>
<div sec:authorize="hasRole('USUARIO')" th:replace="~{fragments/navbar-user :: navbar-user}"></div>

<h1>Héroes Navales</h1>
<table>
    <thead>
    <tr>
        <th>Nombre</th>
        <th>Rango</th>
        <th>Fecha de Nacimiento</th>
        <th>Reseña</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="heroe : ${heroes}">
        <td th:text="${heroe.nombre}"></td>
        <td th:text="${heroe.rango}"></td>
        <td th:text="${heroe.fechaNacimiento}"></td>
        <td th:text="${heroe.descripcion}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
